<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LuxoraMC</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #080808;
    color: white;
}

/* HEADER */

header {
    height: 70px;
    background: #111;
    border-bottom: 1px solid #292929;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 6%;
}

.logo {
    font-size: 25px;
    font-weight: bold;
    color: #9b5cff;
}

/* SAĞ ÜST */

.menu-btn {
    width: 45px;
    height: 45px;
    border: 1px solid #333;
    background: #171717;
    color: white;
    border-radius: 9px;
    font-size: 25px;
    cursor: pointer;
}

.menu-btn:hover {
    background: #242424;
}

/* DROPDOWN */

.menu {
    display: none;
    position: absolute;
    right: 6%;
    top: 80px;
    width: 210px;
    background: #121212;
    border: 1px solid #333;
    border-radius: 12px;
    padding: 8px;
    z-index: 20;
    box-shadow: 0 15px 40px rgba(0,0,0,.5);
}

.menu.active {
    display: block;
}

.menu-item {
    padding: 13px;
    border-radius: 8px;
    cursor: pointer;
}

.menu-item:hover {
    background: #222;
}

.menu-item span {
    margin-right: 8px;
}

/* ANA SAYFA */

.hero {
    min-height: calc(100vh - 70px);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 30px;
    background:
        radial-gradient(circle at center, #281042 0%, #080808 65%);
}

.hero h1 {
    font-size: 70px;
    margin-bottom: 15px;
}

.hero h1 span {
    color: #9b5cff;
}

.hero p {
    color: #aaa;
    font-size: 18px;
}

.server-ip {
    margin-top: 30px;
    background: #111;
    border: 1px solid #292929;
    padding: 13px 20px;
    border-radius: 8px;
    color: #aaa;
}

.server-ip strong {
    color: white;
}

/* PROFİL */

.profile-page {
    display: none;
    min-height: calc(100vh - 70px);
    padding: 40px 20px;
    background:
        radial-gradient(circle at top, #281042 0%, #080808 60%);
}

.profile-page.active {
    display: block;
}

.profile-container {
    max-width: 700px;
    margin: auto;
}

.back {
    color: #aaa;
    cursor: pointer;
    margin-bottom: 20px;
    display: inline-block;
}

.back:hover {
    color: white;
}

.profile-card {
    background: #111;
    border: 1px solid #333;
    border-radius: 16px;
    padding: 35px;
    text-align: center;
}

.avatar {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    background: #9b5cff;
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 45px;
    overflow: hidden;
    border: 4px solid #222;
}

.avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.profile-name {
    margin-top: 18px;
    font-size: 27px;
    font-weight: bold;
}

.profile-description {
    color: #999;
    margin-top: 10px;
    min-height: 25px;
}

.edit-btn {
    margin-top: 25px;
    padding: 12px 25px;
    background: #9b5cff;
    color: white;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
}

.edit-btn:hover {
    background: #7c3dcc;
}

/* PROFİL DÜZENLEME */

.edit-panel {
    display: none;
    margin-top: 25px;
    background: #171717;
    border: 1px solid #333;
    border-radius: 12px;
    padding: 25px;
    text-align: left;
}

.edit-panel.active {
    display: block;
}

.edit-panel label {
    display: block;
    color: #aaa;
    margin-bottom: 7px;
    margin-top: 15px;
}

.edit-panel input,
.edit-panel textarea {
    width: 100%;
    padding: 13px;
    background: #090909;
    color: white;
    border: 1px solid #333;
    border-radius: 8px;
    outline: none;
    font-family: Arial;
}

.edit-panel textarea {
    height: 100px;
    resize: vertical;
}

.edit-panel input:focus,
.edit-panel textarea:focus {
    border-color: #9b5cff;
}

.avatar-upload {
    margin-top: 10px;
}

.save-btn {
    margin-top: 20px;
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 8px;
    background: #9b5cff;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.cancel-btn {
    margin-top: 10px;
    width: 100%;
    padding: 13px;
    border: 1px solid #444;
    border-radius: 8px;
    background: #222;
    color: white;
    cursor: pointer;
}

/* MOBİL */

@media(max-width:600px) {

    .hero h1 {
        font-size: 48px;
    }

    header {
        padding: 0 20px;
    }

    .menu {
        right: 20px;
    }

    .profile-card {
        padding: 25px 18px;
    }
}
</style>
</head>

<body>

<!-- HEADER -->

<header>

    <div class="logo">LuxoraMC</div>

    <button class="menu-btn" onclick="toggleMenu()">☰</button>

</header>


<!-- SAĞ ÜST MENÜ -->

<div class="menu" id="menu">

    <div class="menu-item" onclick="openProfile()">
        <span>👤</span>
        Profil
    </div>

    <div class="menu-item" onclick="home()">
        <span>🏠</span>
        Ana Sayfa
    </div>

</div>


<!-- ANA SAYFA -->

<main class="hero" id="homePage">

    <h1>LUXORA<span>MC</span></h1>

    <p>Yeni nesil Minecraft deneyimine hoş geldin.</p>

    <div class="server-ip">
        Sunucu IP:
        <strong>luxoramc.orc.host</strong>
    </div>

</main>


<!-- PROFİL SAYFASI -->

<section class="profile-page" id="profilePage">

    <div class="profile-container">

        <div class="back" onclick="home()">
            ← Ana Sayfaya Dön
        </div>

        <div class="profile-card">

            <div class="avatar" id="avatar">
                👤
            </div>

            <div class="profile-name" id="profileName">
                Oyuncu
            </div>

            <div class="profile-description" id="profileDescription">
                Henüz bir açıklama eklenmedi.
            </div>

            <button class="edit-btn" onclick="openEdit()">
                ✏️ Profili Düzenle
            </button>


            <!-- DÜZENLEME PANELİ -->

            <div class="edit-panel" id="editPanel">

                <label>Kullanıcı Adı</label>

                <input
                    type="text"
                    id="nameInput"
                    maxlength="20"
                    placeholder="Kullanıcı adın">


                <label>Hakkında</label>

                <textarea
                    id="descriptionInput"
                    maxlength="150"
                    placeholder="Kendinden bahset..."></textarea>


                <label>Profil Fotoğrafı</label>

                <input
                    class="avatar-upload"
                    type="file"
                    id="avatarInput"
                    accept="image/*">


                <button class="save-btn" onclick="saveProfile()">
                    💾 Değişiklikleri Kaydet
                </button>

                <button class="cancel-btn" onclick="closeEdit()">
                    İptal
                </button>

            </div>

        </div>

    </div>

</section>


<script>

/* MENÜ */

function toggleMenu() {

    document
        .getElementById("menu")
        .classList.toggle("active");
}


/* ANA SAYFA */

function home() {

    document
        .getElementById("homePage")
        .style.display = "flex";

    document
        .getElementById("profilePage")
        .classList.remove("active");

    document
        .getElementById("menu")
        .classList.remove("active");
}


/* PROFİL */

function openProfile() {

    document
        .getElementById("homePage")
        .style.display = "none";

    document
        .getElementById("profilePage")
        .classList.add("active");

    document
        .getElementById("menu")
        .classList.remove("active");

    loadProfile();
}


/* DÜZENLE */

function openEdit() {

    document
        .getElementById("editPanel")
        .classList.add("active");

    document
        .getElementById("nameInput")
        .value =
        localStorage.getItem("luxora_name") || "Oyuncu";

    document
        .getElementById("descriptionInput")
        .value =
        localStorage.getItem("luxora_description") || "";
}


/* İPTAL */

function closeEdit() {

    document
        .getElementById("editPanel")
        .classList.remove("active");
}


/* KAYDET */

function saveProfile() {

    const name =
        document
        .getElementById("nameInput")
        .value
        .trim();

    const description =
        document
        .getElementById("descriptionInput")
        .value
        .trim();

    if (!name) {
        alert("Kullanıcı adı boş bırakılamaz!");
        return;
    }

    localStorage.setItem(
        "luxora_name",
        name
    );

    localStorage.setItem(
        "luxora_description",
        description
    );


    /* PROFİL FOTOĞRAFI */

    const file =
        document
        .getElementById("avatarInput")
        .files[0];

    if (file) {

        const reader = new FileReader();

        reader.onload = function(e) {

            localStorage.setItem(
                "luxora_avatar",
                e.target.result
            );

            loadProfile();
        };

        reader.readAsDataURL(file);

    } else {

        loadProfile();
    }

    closeEdit();
}


/* PROFİLİ YÜKLE */

function loadProfile() {

    const name =
        localStorage.getItem("luxora_name")
        || "Oyuncu";

    const description =
        localStorage.getItem("luxora_description")
        || "Henüz bir açıklama eklenmedi.";

    const avatar =
        localStorage.getItem("luxora_avatar");


    document
        .getElementById("profileName")
        .innerText = name;

    document
        .getElementById("profileDescription")
        .innerText = description;


    const avatarElement =
        document.getElementById("avatar");

    if (avatar) {

        avatarElement.innerHTML =
            `<img src="${avatar}">`;

    } else {

        avatarElement.innerHTML = "👤";
    }
}


/* SAYFA AÇILINCA */

loadProfile();

</script>

</body>
</html>
